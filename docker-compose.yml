version: "3.8"

services:

  # -----------------------
  # DATABASE
  # -----------------------
  db.openelis.org:
    image: itechuw/openelis-global-2-database:develop
    container_name: openelisglobal-database
    platform: linux/amd64
    restart: always
    ports:
      - "15432:5432"
    env_file:
      - ./volume/database/database.env
    environment:
      DB_PASSWORD: ${OE_DB_PASSWORD:-clinlims}
      DB_SUPERUSER_PASSWORD: ${ADMIN_PASSWORD:-superuser}
    volumes:
      - db-data:/var/lib/postgresql/data
    networks:
      openelis-net:
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "clinlims"]
      interval: 10s
      timeout: 5s
      retries: 10

  # -----------------------
  # CERTIFICATES
  # -----------------------
  certs:
    image: itechuw/certgen:main
    container_name: oe-certs
    platform: linux/amd64
    restart: "no"
    environment:
      KEYSTORE_PW: kspass
      TRUSTSTORE_PW: tspass
    volumes:
      - key_trust-store-volume:/etc/openelis-global
      - keys-vol:/etc/ssl/private
      - certs-vol:/etc/ssl/certs
    networks:
      openelis-net:

  # -----------------------
  # OPENELIS WEBAPP
  # -----------------------
  oe.openelis.org:
    image: itechuw/openelis-global-2:develop
    container_name: openelisglobal-webapp
    platform: linux/amd64
    restart: always
    depends_on:
      db.openelis.org:
        condition: service_healthy
      certs:
        condition: service_started
    ports:
      - "8080:8080"
      - "8443:8443"
    environment:
      DEFAULT_PW: adminADMIN!
      TZ: Africa/Nairobi
      CATALINA_OPTS: >
        -Ddatasource.url=jdbc:postgresql://db.openelis.org:5432/clinlims
        -Ddatasource.username=clinlims
        -Ddatasource.password=${OE_DB_PASSWORD:-clinlims}
        -Doe.ssl.truststorepath=/etc/openelis-global/truststore
        -Doe.ssl.truststorepassword=tspass
        -Doe.ssl.keystorepath=/etc/openelis-global/keystore
        -Doe.ssl.keystorepassword=kspass
    volumes:
      - key_trust-store-volume:/etc/openelis-global
      - ./volume/plugins/:/var/lib/openelis-global/plugins
      - ./volume/lucene:/var/lib/lucene_index
      - ./configuration:/var/lib/openelis-global/configuration
    networks:
      - openelis-net

  # -----------------------
  # FHIR SERVER
  # -----------------------
  fhir.openelis.org:
    image: itechuw/openelis-global-2-fhir:develop
    container_name: external-fhir-api
    platform: linux/amd64
    restart: always
    depends_on:
      db.openelis.org:
        condition: service_healthy
    ports:
      - "8081:8080"
      - "8444:8443"
    environment:
      TZ: Africa/Nairobi
      FHIR_DATASOURCE_URL: jdbc:postgresql://db.openelis.org:5432/clinlims?currentSchema=clinlims
      FHIR_DATASOURCE_USERNAME: clinlims
      FHIR_DATASOURCE_PASSWORD: ${OE_DB_PASSWORD:-clinlims}
      FHIR_SERVER_ADRESS: http://fhir.openelis.org:8080/fhir/
    volumes:
      - key_trust-store-volume:/etc/openelis-global
    networks:
      openelis-net:

  # -----------------------
  # MIDDLEWARE
  # -----------------------
  middlewares:
    build:
      context: ./LabMiddleware
      dockerfile: Dockerfile
    image: openelisglobal-middleware
    container_name: openelisglobal-middlewares
    platform: linux/amd64
    restart: always
    depends_on:
      oe.openelis.org:
        condition: service_started
    ports:
      - "5000:80"
    environment:
      ASPNETCORE_URLS: http://+:5000
      LIS_URL: http://oe.openelis.org:8080/middleware/receive-result
    networks:
      openelis-net:

  # -----------------------
  # FRONTEND
  # -----------------------
  frontend.openelis.org:
    image: itechuw/openelis-global-2-frontend:develop
    container_name: openelisglobal-front-end
    platform: linux/amd64
    environment:
      CHOKIDAR_USEPOLLING: "true"
    tty: true
    networks:
      openelis-net:

  # -----------------------
  # PROXY
  # -----------------------
  proxy:
    image: itechuw/openelis-global-2-proxy:develop
    container_name: openelisglobal-proxy
    platform: linux/amd64
    restart: unless-stopped
    depends_on:
      - oe.openelis.org
      - fhir.openelis.org
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - certs-vol:/etc/nginx/certs/
      - keys-vol:/etc/nginx/keys/
      - ./volume/nginx/nginx-prod.conf:/etc/nginx/nginx.conf:ro
    networks:
      openelis-net:

# -----------------------
# NETWORK
# -----------------------
networks:
  openelis-net:
    driver: bridge

# -----------------------
# VOLUMES
# -----------------------
volumes:
  db-data:
  key_trust-store-volume:
  certs-vol:
  keys-vol: